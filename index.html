const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function open(pw){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));
  return new TextDecoder().decode(pt);
}
function show(h){document.open();document.write(h);document.close();}
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();const b=document.getElementById('b'),e=document.getElementById('e');
  const pw=document.getElementById('p').value.trim().toUpperCase();
  b.disabled=true;e.textContent='';
  try{const h=await open(pw);show(h);}
  catch(err){e.textContent='Nepareiza parole.';b.disabled=false;}
});
